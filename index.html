<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập 1</title>
</head>
<body>
    <p id ="root"></p>
    <script>
        const x=document.getElementById("root")
        const products = [
            {name:"laptop",price:10,quantity:5},
            {name:"keyboard", price:20, quantity:10},
            {name:"monitor",price:10, quantity:15}
]

for(const p of products){
    x.innerHTML= `<p> The product </br>
        name: ${p.name} </br>
        price: ${p.price} </br>
        quatity: ${p.quantity} </p>`
}

    </script>
</body>
</html>
